<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f5c4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>AgroControl</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <!-- Estilos: archivo aparte, sin dependencias externas (funciona 100% offline) -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- Cabecera fija: marca, tasa BCV y selector de registro activo -->
  <header class="topbar">
    <div class="wrap" id="header"></div>
  </header>

  <!-- Vista principal (se renderiza desde js/views/*) -->
  <main class="wrap" id="view"></main>

  <!-- Navegación inferior -->
  <nav class="nav" id="nav" aria-label="Navegación principal"></nav>

  <!-- Contenedores de modal y aviso -->
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- ===== JavaScript: un archivo por responsabilidad. El orden importa. ===== -->
  <script src="js/utils.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/calc.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/share.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/shell.js"></script>
  <script src="js/views/panel.js"></script>
  <script src="js/views/registro.js"></script>
  <script src="js/views/inventario.js"></script>
  <script src="js/views/lotes.js"></script>
  <script src="js/views/ciclos.js"></script>
  <script src="js/views/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
